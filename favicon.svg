<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>ComfyRemix</title>
  <!-- The node graph out of the logo's phone, on its own. The phone outline and
       its badge close up into a grey blob at 16px, where the three-way fan still
       reads as a graph — and a graph is the thing this app is about. Purple to
       magenta is the "Remix" script's own gradient.
       Drawn wide on purpose: the targets sit 7 units apart in a 32 unit box,
       which is the closest they can be and still be three dots rather than one
       bar in a tab. Curved rather than straight spokes for the same reason the
       logo curves them — straight ones read as a share arrow. -->
  <defs>
    <linearGradient id="g" x1="5" y1="27" x2="27" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#f08bff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17111f"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <g fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round">
    <path d="M9.6 16h2.2c2.8 0 2.6-3.6 4.6-5.6 1.1-1.1 2-1.4 3.4-1.4"/>
    <path d="M9.6 16h10.2"/>
    <path d="M9.6 16h2.2c2.8 0 2.6 3.6 4.6 5.6 1.1 1.1 2 1.4 3.4 1.4"/>
  </g>
  <g fill="url(#g)">
    <circle cx="8" cy="16" r="3"/>
    <circle cx="23" cy="9" r="2.8"/>
    <circle cx="23" cy="16" r="2.8"/>
    <circle cx="23" cy="23" r="2.8"/>
  </g>
</svg>
